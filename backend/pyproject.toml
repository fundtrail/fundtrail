[project]
name = "fundtrail-backend"
version = "0.1.0"
description = "FundTrail backend: FastAPI app"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi[standard]>=0.162.2",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.5.0",
    "langgraph>=1.2.20",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "procrastinate>=3.10.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.15.1",
    "pypdfium2>=5.15.2",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
