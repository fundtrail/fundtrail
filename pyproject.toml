[project]
name = "fundtrail"
version = "0.1.0"
description = "Grant closeout review: match each expense to its rule and evidence, with citations to the source text."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fundtrail"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Import from the repo root so tests never depend on the editable install's
# .pth file (macOS can flag it hidden, and Python then skips it).
pythonpath = ["."]
testpaths = ["tests"]
