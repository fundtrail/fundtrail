<!-- @dsCard group="Judgment" height=1360 width=720 subtitle="What each charge should have, filled or missing, who added each item, and removals waiting for you (PR 6)" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvidenceChecklist preview</title>
<style>
  body { margin: 0; background: var(--paper); }
  .cl-demo { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); box-sizing: border-box; }
  .cl-case { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .cl-case__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
  .cl-case__head h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
  .cl-case__head span { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
</style>
</head>
<body>
<main class="cl-demo" id="cl-demo" aria-label="Evidence checklist examples">
  <section class="cl-case" aria-labelledby="c1"><div class="cl-case__head"><h2 id="c1">L-0981 &middot; Conference registration</h2><span>In the demo &middot; <span class="ft-amount">$650.00</span></span></div><div id="cl-1"></div></section>
  <section class="cl-case" aria-labelledby="c2"><div class="cl-case__head"><h2 id="c2">A trip</h2><span>The agent adds the items &middot; <span class="ft-amount">$2,300.00</span></span></div><div id="cl-2"></div></section>
  <section class="cl-case" aria-labelledby="c3"><div class="cl-case__head"><h2 id="c3">A salary line for January</h2><span>One report fills three months &middot; <span class="ft-amount">$6,000.00</span></span></div><div id="cl-3"></div></section>
  <section class="cl-case" aria-labelledby="c4"><div class="cl-case__head"><h2 id="c4">A laptop posted as a stipend</h2><span>A removal waiting for you &middot; <span class="ft-amount">$1,500.00</span></span></div><div id="cl-4"></div></section>
  <section class="cl-case" aria-labelledby="c5"><div class="cl-case__head"><h2 id="c5">A guest speaker's stipend</h2><span>A swap you accepted &middot; <span class="ft-amount">$500.00</span></span></div><div id="cl-5"></div></section>
</main>
<!-- @checklist-script -->
<script>
(function () {
  var h = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) h[p[0]] = p[1] || ''; });
  if (h.t) document.documentElement.setAttribute('data-theme', h.t);
  if (h.w) document.getElementById('cl-demo').style.width = parseInt(h.w, 10) + 'px';
  var $ = function (id) { return document.getElementById(id); };
  FTChecklist.mount($('cl-1'), [
    { need: 'A bill that adds up to the charge', by: 'default', state: 'filled', filledBy: { name: 'Registration receipt', amount: '$650.00', of: '$650.00' } },
    { need: 'Program officer’s written approval, through Research.gov', by: 'code', state: 'missing', expected: 'Oct 3, 2025', note: '' }
  ], { account: 'Participant Support Costs', today: 'Apr 12, 2026' });
  FTChecklist.mount($('cl-2'), [
    { need: 'Airfare receipt, $1,800.00', by: 'agent', state: 'filled', filledBy: { name: 'airfare_receipt.pdf', amount: '$1,800.00', of: '$1,800.00' } },
    { need: 'Per diem, 5 days at $100.00 a day', by: 'agent', state: 'filled', rule: { kind: 'rate', math: '5 days × $100.00 = $500.00' }, filledBy: { name: 'Rate from travel_policy.pdf, page 2' } }
  ], { account: 'Travel', sum: { parts: ['$1,800.00', '$500.00'], total: '$2,300.00' }, today: 'Apr 12, 2026' });
  FTChecklist.mount($('cl-3'), [
    { need: 'Appointment letter', by: 'default', state: 'filled', filledBy: { name: 'appointment_letter_2026.pdf' } },
    { need: 'Effort report', period: 'January 2026', by: 'default', state: 'filled', filledBy: { name: 'effort_report_Q1_2026.pdf', note: 'Also fills February and March' } }
  ], { account: 'Salaries and Wages', today: 'Apr 12, 2026' });
  FTChecklist.mount($('cl-4'), [
    { need: 'Participant list', by: 'default', state: 'missing', expected: 'Mar 2, 2026', removal: { by: 'agent', reason: 'The invoice is for a laptop, not a participant cost, so a participant list doesn’t apply. The charge may be posted to the wrong account.', state: 'waiting' } },
    { need: 'A bill that adds up to the charge', by: 'agent', state: 'filled', filledBy: { name: 'invoice_laptop_5521.pdf', amount: '$1,500.00', of: '$1,500.00' } }
  ], { account: 'Participant Support Stipends', today: 'Apr 12, 2026' });
  FTChecklist.mount($('cl-5'), [
    { need: 'Participant list', by: 'default', state: 'missing', removal: { by: 'agent', reason: 'One guest speaker, paid an honorarium.', state: 'accepted' }, removed: { by: 'you', note: 'Removed by you, Mar 18, 2026, accepting the agent’s suggestion: one guest speaker, paid an honorarium.' } },
    { need: 'Honorarium letter', by: 'agent', state: 'filled', filledBy: { name: 'honorarium_letter_speaker.pdf', amount: '$500.00', of: '$500.00' } }
  ], { account: 'Participant Support Stipends', today: 'Apr 12, 2026' });
})();
</script>
</body>
</html>
