<!-- @dsCard group="Navigation" height=900 width=1440 page subtitle="The workspace and account menus, and the dialogs for a new workspace and a reset" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkspaceMenu preview</title>
<style>
  .ft-app { min-height: 900px; }
  .ft-sidebar { position: relative; height: auto; }
  .demo-footrow { display: flex; justify-content: space-between; align-items: center; }
  .demo-seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius-md); overflow: hidden; height: 24px; box-sizing: border-box; }
  .demo-seg button { font: inherit; font-size: 12px; font-weight: 600; border: 0; background: var(--paper-raised); color: var(--ink-muted); padding: 0 var(--space-2); cursor: pointer; }
  .demo-seg button + button { border-left: 1px solid var(--rule); }
  .demo-seg button[aria-pressed="true"] { background: var(--paper-sunken); color: var(--ink); }
  .demo-seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .wm-page { max-width: 960px; display: flex; flex-direction: column; gap: var(--space-3); }
  .wm-title { margin: 2px 0 0; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.01em; }
</style>
</head>
<body>
<div class="ft-app">
  <aside class="ft-sidebar" aria-label="Navigation">
    <span class="ft-wordmark">FundTrail</span>
    <div class="ft-workspace"><span>Demo workspace</span><span class="ft-caption">Switch</span></div>
    <nav class="ft-nav" aria-label="Workspace">
      <a class="ft-nav__item is-active" href="#" aria-current="page">Workspace</a>
      <span class="ft-nav__label">Grants</span>
      <a class="ft-nav__item" href="#">Example Bay <span class="ft-count ft-count--alert">3</span></a>
      <a class="ft-nav__item" href="#">Kelp Forest Survey <span class="ft-count ft-count--alert">2</span></a>
      <a class="ft-nav__item" href="#">Tidal Marsh Carbon</a>
      <a class="ft-nav__item ft-nav__item--add" href="#">Add a grant</a>
    </nav>
    <div class="ft-sidebar__foot">
      <span class="ft-caption">Clock</span>
      <b class="ft-amount" id="wm-clock">Apr 12, 2026</b>
      <button type="button" class="ft-btn ft-btn--sm ft-sidebar__next" disabled>Nothing else scheduled</button>
      <div class="demo-footrow"><button class="ft-btn ft-btn--sm ft-btn--quiet" style="padding-left:0">Account</button><span class="demo-seg" role="group" aria-label="Theme"><button type="button" data-set-theme="light">Light</button><button type="button" data-set-theme="dark">Dark</button></span></div>
    </div>
  </aside>

  <div class="ft-main">
    <header class="ft-topbar">
      <div class="ft-topbar__title"><span class="ft-crumbs" id="wm-crumbs"><b>Demo workspace</b></span></div>
      <div></div>
    </header>
    <div class="ft-content">
      <div class="wm-page">
        <div><span class="ft-caption" id="wm-caption">3 grants <span class="ft-sep">&middot;</span> Apr 12, 2026</span><h1 class="wm-title" id="wm-title">Demo workspace</h1></div>
        <div id="wm-status"></div>
      </div>
    </div>
  </div>
</div>

<!-- @menu-script -->
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function done(text) { $('wm-status').innerHTML = '<div class="ft-trail__done" role="status" tabindex="-1" style="margin-top:0"><span>' + text + '</span></div>'; }
  var menu = FTWorkspaceMenu.attach({
    onNavigate: function (kind, value) {
      var opts = FTWorkspaceMenu.options();
      if (kind === 'workspace' || kind === 'new') {
        var name = kind === 'new' ? value : opts.workspaces.filter(function (w) { return w.id === value; })[0].name;
        var demo = kind === 'workspace' && value === 'demo';
        $('wm-title').textContent = name; $('wm-crumbs').innerHTML = '<b></b>'; $('wm-crumbs').firstChild.textContent = name;
        $('wm-caption').innerHTML = demo ? '3 grants <span class="ft-sep">&middot;</span> ' + $('wm-clock').textContent : 'No grants yet';
        $('wm-status').innerHTML = '';
      } else if (kind === 'reset') {
        $('wm-clock').textContent = 'Apr 9, 2026';
        $('wm-caption').innerHTML = '3 grants <span class="ft-sep">&middot;</span> Apr 9, 2026';
        done('Demo workspace reset. Everything is back where the demo starts.');
      } else if (kind === 'signout') {
        done('Signed out. In the app, this opens the sign-in page.');
      }
    }
  });
  var root = document.documentElement, themes = document.querySelectorAll('[data-set-theme]');
  function markTheme() { var th = root.getAttribute('data-theme') || 'light'; themes.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-set-theme') === th)); }); }
  themes.forEach(function (b) { b.addEventListener('click', function () { root.setAttribute('data-theme', b.getAttribute('data-set-theme')); markTheme(); }); });
  document.addEventListener('click', function (e) { var a = e.target.closest ? e.target.closest('a') : null; if (a) e.preventDefault(); });
  /* a hash can open a state, for screenshots: #open=workspace|account, #dialog=new|reset, #err=1 (new, empty name), #t=dark */
  var h = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) h[p[0]] = p[1] || ''; });
  if (h.t) root.setAttribute('data-theme', h.t);
  markTheme();
  if (h.open) menu.open(h.open);
  if (h.dialog) { menu.dialog(h.dialog); if (h.err === '1') { var b = document.querySelector('[data-ft-dialog="create"]'); if (b) b.click(); } }
})();
</script>
</body>
</html>
