<title>FundTrail Screens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/*TOKENS*/
/* Layout: an overview grid of every screen in journey order; a screen opens full width under a slim bar. */
html, body { height: 100%; overflow-x: hidden; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
:root { --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif; }
.ov { max-width: 1240px; margin: 0 auto; padding-block: 32px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
.ov h1 { margin: 0; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.ov p { margin: 4px 0 0; color: var(--ink-muted); font-size: 14px; line-height: 21px; max-width: 70ch; }
.ov-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.tile { font: inherit; text-align: left; color: inherit; background: var(--paper-raised); border: 1px solid var(--rule); border-radius: var(--radius-md); padding: 0; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.tile:hover { border-color: var(--ink-muted); }
.tile:focus-visible, .btn:focus-visible, .step:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.thumb { display: block; aspect-ratio: 16 / 10; overflow: hidden; border-bottom: 1px solid var(--rule); background: var(--paper-sunken); max-width: 100%; }
.thumb img { display: block; }
.thumb img.is-cover { width: 100%; height: 100%; object-fit: cover; }
.stagelabel { font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); }
.clock { flex: none; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink); padding: 4px 8px; border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--paper); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: var(--radius-pill); background: var(--paper-sunken); color: var(--ink); font-weight: 600; }
.note { color: var(--ink); font-weight: 600; }
@media (max-width: 760px) { .clock { display: none; } }
.tile .tbody { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 12px; }
.tile b { font-size: 14px; line-height: 20px; }
.tile i { font-style: normal; font-size: 12px; line-height: 17px; color: var(--ink-muted); }
.n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); margin-right: 6px; }
.btn { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); background: var(--paper-raised); border: 1px solid var(--rule-strong); border-radius: var(--radius-md); height: 30px; padding: 0 12px; cursor: pointer; }
.btn--main { border-width: 2px; }
.btn[disabled] { color: var(--ink-muted); border-style: dashed; cursor: default; }
.btn[aria-pressed="true"] { background: var(--paper-sunken); }
.view { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); height: 100%; }
.bar { min-width: 0; }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--rule); background: var(--paper-raised); }
.steps { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.step { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-muted); background: none; border: 0; border-radius: var(--radius-sm); padding: 6px 8px; cursor: pointer; white-space: nowrap; }
.step[aria-current="step"] { background: var(--paper-sunken); color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.tools { display: flex; gap: 6px; flex: none; }
.hint { margin: 0; font-size: 12px; line-height: 16px; color: var(--ink-muted); padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--paper-raised); border-bottom: 1px solid var(--rule); }
.hint b { color: var(--ink); }
iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--paper); }
@media (max-width: 760px) { .tools .t-hide { display: none; } }
</style>

<main class="ov" id="ov" aria-labelledby="ov-h">
  <div>
    <h1 id="ov-h">FundTrail screens</h1>
    <p>Every screen of the design, in the order the accountant meets them. Click a screen to open it full size. Inside, its own buttons move you on: Continue with Google, a grant's row, the sidebar, Evidence report, Sign out. All data is synthetic.</p>
  </div>
  <div class="ov-tools"><button type="button" class="btn btn--main" data-open="signin">Start the walkthrough</button><span style="flex:1"></span><button type="button" class="btn" data-th="light">Light</button><button type="button" class="btn" data-th="dark">Dark</button></div>
  <div class="grid" id="grid"></div>
</main>

<div class="view" id="view" hidden>
  <nav class="bar" aria-label="Screens">
    <button type="button" class="btn" id="back-ov">All screens</button>
    <div class="steps" id="steps"></div>
    <span class="clock" id="clock" aria-live="polite"></span>
    <div class="tools"><button type="button" class="btn" id="prev">Back</button><button type="button" class="btn" id="next">Next</button><button type="button" class="btn t-hide" id="restart">Restart</button><button type="button" class="btn t-hide" data-th="light">Light</button><button type="button" class="btn t-hide" data-th="dark">Dark</button></div>
  </nav>
  <p class="hint" id="hint" role="status"></p>
  <iframe id="frame" title="Screen"></iframe>
</div>

<script>
/*CLOCK*/
(function () {
  var META = /*META*/;
  var DOCS = /*DOCS*/;
  var $ = function (id) { return document.getElementById(id); };
  var theme = 'light', cur = -1, urls = {}, noteTimer = null;
  try { theme = localStorage.getItem('ft-screens-theme') || 'light'; } catch (e) {}
  function idx(id) { for (var i = 0; i < META.length; i++) if (META[i].id === id) return i; return -1; }
  function url(id) { var k = id + ':' + theme; if (!urls[k]) urls[k] = URL.createObjectURL(new Blob([DOCS[k]], { type: 'text/html' })); return urls[k]; }
  function paintTheme() { document.documentElement.setAttribute('data-theme', theme); document.querySelectorAll('[data-th]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-th') === theme)); }); }
  /* Thumbnails are 1440x900 screenshots; crop to what matters: the main area past the sidebar, the sign-in card, the top of a page */
  var CROP = { signin: 'width:250%;max-width:none;margin-left:-75%;margin-top:-46.9%', report: 'cover', map: 'cover' };
  var APP = 'width:120%;max-width:none;margin-left:-20%;margin-top:-4.7%';
  $('grid').innerHTML = META.map(function (m, i) {
    var c = CROP[m.id] || APP, img = c === 'cover' ? '<img class="is-cover" src="' + m.thumb + '" alt="" style="object-position:top center">' : '<img src="' + m.thumb + '" alt="" style="' + c + '">';
    return '<button type="button" class="tile" data-open="' + m.id + '"><span class="thumb">' + img + '</span><span class="tbody"><span class="stagelabel">' + m.stage + '</span><b><span class="n">' + (i + 1) + '</span>' + m.label + '</b><i>' + m.hint + '</i></span></button>';
  }).join('');
  function overview() { cur = -1; $('view').hidden = true; $('ov').hidden = false; $('frame').removeAttribute('src'); }
  function open(i) {
    cur = Math.max(0, Math.min(META.length - 1, i)); var m = META[cur];
    $('ov').hidden = true; $('view').hidden = false;
    var h = FTWalkClock.hashFor(m);
    $('frame').src = url(m.id) + '#' + (h ? h + '&' : '') + 't=' + theme; $('frame').title = m.label;
    $('steps').innerHTML = META.map(function (s, k) { return '<button type="button" class="step" data-i="' + k + '"' + (k === cur ? ' aria-current="step"' : '') + '><span class="n">' + (k + 1) + '</span>' + s.label + '</button>'; }).join('');
    hint();
    $('prev').disabled = cur === 0; $('next').disabled = cur === META.length - 1;
    var a = document.querySelector('.step[aria-current]'), st = $('steps');
    if (a) { if (a.offsetLeft < st.scrollLeft) st.scrollLeft = a.offsetLeft - 8; else if (a.offsetLeft + a.offsetWidth > st.scrollLeft + st.clientWidth) st.scrollLeft = a.offsetLeft + a.offsetWidth - st.clientWidth + 8; }
  }
  function hint() {
    if (cur < 0) return; var m = META[cur]; clearTimeout(noteTimer);
    $('hint').innerHTML = '<b>' + m.stage + ' \u00b7 ' + m.label + '.</b> ' + m.hint + (FTWalkClock.shownLater(m) ? ' <span class="chip">' + FTWalkClock.chip + '</span>' : '');
    $('clock').textContent = FTWalkClock.label();
  }
  function note(text) { if (cur < 0) return; clearTimeout(noteTimer); $('hint').innerHTML = '<span class="note">' + text + '</span>'; noteTimer = setTimeout(hint, 4000); }
  function route() { var i = idx(location.hash.replace('#', '')); if (i >= 0) open(i); else overview(); }
  function go(i) { var id = i < 0 ? '' : META[i].id; if (location.hash.replace('#', '') === id) route(); else location.hash = id; }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-open')) go(idx(b.getAttribute('data-open')));
    else if (b.hasAttribute('data-i')) go(+b.getAttribute('data-i'));
    else if (b.id === 'prev') go(cur - 1);
    else if (b.id === 'next') go(cur + 1);
    else if (b.id === 'restart') { if (META[cur].id === 'grant') FTWalkClock.reset(); open(cur); }
    else if (b.id === 'back-ov') { location.hash = ''; overview(); }
    else if (b.hasAttribute('data-th')) { theme = b.getAttribute('data-th'); try { localStorage.setItem('ft-screens-theme', theme); } catch (e2) {} paintTheme(); if (cur >= 0) open(cur); }
  });
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d) return;
    if (d.ftGo) { var i = idx(d.ftGo); if (i >= 0) go(i); }
    else if (d.ftClock && cur >= 0 && META[cur].id === 'grant' && e.source === $('frame').contentWindow) { if (FTWalkClock.set(d.ftClock.step)) hint(); }
    else if (d.ftNote) note(d.ftNote);
  });
  window.addEventListener('hashchange', route);
  paintTheme(); route();
})();
</script>
