<!-- @dsCard group="Demo" height=1000 width=1440 page subtitle="Clickable walkthrough: every screen in order, joined by its real buttons. Start here." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkthrough</title>
<style>
  html, body { margin: 0; height: 100%; overflow-x: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .wk { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100vh; min-height: 1000px; }
  .wk-bar, .wk-top { min-width: 0; }
  .wk-bar { display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--rule); background: var(--paper-raised); }
  .wk-brand { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .wk-steps { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .wk-step { font: inherit; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted); background: none; border: 0; border-radius: var(--radius-sm); padding: 6px 8px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .wk-step b { font-family: var(--font-mono); font-weight: 500; font-size: 11px; }
  .wk-step:hover { background: var(--paper-sunken); color: var(--ink); }
  .wk-step[aria-current="step"] { background: var(--paper-sunken); color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
  .wk-step:focus-visible, .wk-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .wk-tools { display: flex; gap: 6px; align-items: center; flex: none; }
  .wk-btn { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); background: var(--paper-raised); border: 1px solid var(--rule-strong); border-radius: var(--radius-md); height: 28px; padding: 0 10px; cursor: pointer; }
  .wk-btn[disabled] { color: var(--ink-muted); border-style: dashed; cursor: default; }
  .wk-btn[aria-pressed="true"] { background: var(--paper-sunken); }
  .wk-hint { grid-column: 1 / -1; font-size: 12px; line-height: 16px; color: var(--ink-muted); padding: 0 16px 8px; background: var(--paper-raised); border-bottom: 1px solid var(--rule); }
  .wk-hint b { color: var(--ink); }
  .wk-clock { flex: none; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink); padding: 4px 8px; border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--paper); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .wk-chip { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: var(--radius-pill); background: var(--paper-sunken); color: var(--ink); font-weight: 600; white-space: nowrap; }
  .wk-note { color: var(--ink); font-weight: 600; }
  .wk-frame { width: 100%; height: 100%; border: 0; display: block; background: var(--paper); }
  .wk-top { display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="wk">
  <div class="wk-top">
    <nav class="wk-bar" aria-label="Walkthrough">
      <span class="wk-brand">FundTrail walkthrough</span>
      <div class="wk-steps" id="wk-steps" role="list"></div>
      <span class="wk-clock" id="wk-clock" aria-live="polite"></span>
      <div class="wk-tools">
        <button type="button" class="wk-btn" id="wk-prev">Back</button>
        <button type="button" class="wk-btn" id="wk-next">Next</button>
        <button type="button" class="wk-btn" id="wk-restart" title="Reload this screen from its start">Restart screen</button>
        <button type="button" class="wk-btn" data-th="light">Light</button><button type="button" class="wk-btn" data-th="dark">Dark</button>
      </div>
    </nav>
    <p class="wk-hint" id="wk-hint" role="status"></p>
  </div>
  <iframe class="wk-frame" id="wk-frame" title="Screen"></iframe>
</div>
<script>
/*CLOCK*/
(function () {
  var META = /*META*/;
  var DOCS = /*DOCS*/;
  var urls = {}, cur = 0, theme = 'light', noteTimer = null;
  var $ = function (id) { return document.getElementById(id); };
  try { var saved = localStorage.getItem('ft-walk-theme'); if (saved) theme = saved; } catch (e) {}
  function url(id) { var k = id + ':' + theme; if (!urls[k]) urls[k] = URL.createObjectURL(new Blob([DOCS[k]], { type: 'text/html' })); return urls[k]; }
  function show(i, push) {
    cur = Math.max(0, Math.min(META.length - 1, i)); var m = META[cur];
    var h = FTWalkClock.hashFor(m);
    $('wk-frame').src = url(m.id) + '#' + (h ? h + '&' : '') + 't=' + theme;
    $('wk-frame').title = m.label;
    $('wk-steps').innerHTML = META.map(function (s, k) { return '<button type="button" role="listitem" class="wk-step" data-i="' + k + '"' + (k === cur ? ' aria-current="step"' : '') + '><b>' + (k + 1) + '</b>' + s.label + '</button>'; }).join('');
    hint();
    $('wk-prev').disabled = cur === 0; $('wk-next').disabled = cur === META.length - 1;
    document.querySelectorAll('[data-th]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-th') === theme)); });
    document.documentElement.setAttribute('data-theme', theme);
    if (push !== false) try { history.replaceState(null, '', '#' + m.id); } catch (e) {}
    var a = document.querySelector('.wk-step[aria-current]'), st = $('wk-steps'); if (a) { if (a.offsetLeft < st.scrollLeft) st.scrollLeft = a.offsetLeft - 8; else if (a.offsetLeft + a.offsetWidth > st.scrollLeft + st.clientWidth) st.scrollLeft = a.offsetLeft + a.offsetWidth - st.clientWidth + 8; }
  }
  function hint() {
    var m = META[cur]; clearTimeout(noteTimer);
    $('wk-hint').innerHTML = '<b>' + m.stage + ' \u00b7 ' + m.label + '.</b> ' + m.hint + (FTWalkClock.shownLater(m) ? ' <span class="wk-chip">' + FTWalkClock.chip + '</span>' : '');
    $('wk-clock').textContent = FTWalkClock.label();
  }
  function note(text) { clearTimeout(noteTimer); $('wk-hint').innerHTML = '<span class="wk-note">' + text + '</span>'; noteTimer = setTimeout(hint, 4000); }
  function byId(id) { for (var k = 0; k < META.length; k++) if (META[k].id === id) return k; return -1; }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-i')) show(+b.getAttribute('data-i'));
    else if (b.id === 'wk-prev') show(cur - 1);
    else if (b.id === 'wk-next') show(cur + 1);
    else if (b.id === 'wk-restart') { if (META[cur].id === 'grant') FTWalkClock.reset(); show(cur); }
    else if (b.hasAttribute('data-th')) { theme = b.getAttribute('data-th'); try { localStorage.setItem('ft-walk-theme', theme); } catch (e2) {} show(cur); }
  });
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d) return;
    if (d.ftGo) { var k = byId(d.ftGo); if (k >= 0) show(k); }
    else if (d.ftClock && META[cur].id === 'grant' && e.source === $('wk-frame').contentWindow) { if (FTWalkClock.set(d.ftClock.step)) hint(); }
    else if (d.ftNote) note(d.ftNote);
  });
  var start = byId(location.hash.replace('#', '')); show(start >= 0 ? start : 0, false);
})();
</script>
</body>
</html>
