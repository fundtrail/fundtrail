<html lang="en">

  .demo-footrow { display: flex; justify-content: space-between; align-items: center; }
  .demo-seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius-md); overflow: hidden; height: 24px; box-sizing: border-box; }
  .demo-seg button { font: inherit; font-size: 12px; font-weight: 600; border: 0; background: var(--paper-raised); color: var(--ink-muted); padding: 0 var(--space-2); cursor: pointer; }

  .demo-seg button[aria-pressed="true"] { background: var(--paper-sunken); color: var(--ink); }
  .demo-seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
</style>
</head>
<body>
<div class="ft-app">
  <aside class="ft-sidebar" aria-label="Navigation">

      <div class="demo-footrow"><button class="ft-btn ft-btn--sm ft-btn--quiet" style="padding-left:0">Account</button><span class="demo-seg" role="group" aria-label="Theme"><button type="button" data-set-theme="light">Light</button><button type="button" data-set-theme="dark">Dark</button></span></div>

<!-- @pr6-scripts -->
<script>
/* FundTrail review thread: one charge's (or one record's) conversation. Code's reasons, the agent's comments,
   suggestions and disputes, the accountant's replies and decisions, and a box to ask the agent.
   FTThread.render(thread, opts)            returns HTML for a thread
   FTThread.bind(container, thread, opts)   draws it into container and wires Accept, Reject, Undo and Ask
   thread: { id, about: 'L-1019', entries: [entry] }
   entry:  { who: 'code'|'agent'|'you', date, text, kind: 'reason'|'comment'|'suggestion'|'dispute'|'answer'|'decision',
             result?: 'fails'|'passes'|'missing', answer?: 'supports'|'contradicts'|'unsure',
             quote?: { text, loc }, change?: { now, suggested }, check?: 'the check a dispute names',
             effect?: 'what accepting does', state?: 'waiting'|'accepted'|'rejected', decided?: date, pending?: true }
   opts:   { heading: 'Thread', ask: true, today: 'Apr 12, 2026', undoMs: 8000,
             onAccept(entry), onReject(entry), onUndo(entry, was), onAsk(question, reply(entry)) }
   Plain ES5, no dependencies. */
(function () {
  var T = window.FTThread = window.FTThread || {};
  var WHO = { code: 'Code', agent: 'Agent', you: 'You' };
  var RESULT = { fails: 'Fails', passes: 'Passes', missing: 'Missing' };
  var ANSWER = { supports: 'Supports', contradicts: 'Contradicts', unsure: 'Unsure' };
  var seq = 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function boxHtml(e, i, tid) {
    var head = e.kind === 'dispute' ? 'Dispute' : 'Suggestion', st = e.state || 'waiting';
    var h = '<div class="ft-th__box is-' + st + '" role="group" aria-labelledby="' + tid + '-bh' + i + '">' +
      '<p class="ft-th__boxhead" id="' + tid + '-bh' + i + '"><span>' + head + '</span>' +
      (st === 'waiting' ? '<span class="ft-th__boxstate">waiting for you</span>' : '') + '</p>';
    if (e.kind === 'dispute' && e.check) h += '<p class="ft-th__check">Disputes the check: <b>' + esc(e.check) + '</b></p>';
    if (e.change) h += '<dl class="ft-th__change"><dt>Now</dt><dd>' + esc(e.change.now) + '</dd><dt>Suggested</dt><dd>' + esc(e.change.suggested) + '</dd></dl>';
    if (e.effect && st === 'waiting') h += '<p class="ft-th__effect">' + esc(e.effect) + '</p>';
    if (st === 'waiting') {
      h += '<div class="ft-th__actions"><button type="button" class="ft-btn ft-btn--sm ft-btn--approve ft-btn--main" data-th-act="accept" data-th-i="' + i + '">Accept</button>' +
        '<button type="button" class="ft-btn ft-btn--sm ft-btn--reject" data-th-act="reject" data-th-i="' + i + '">Reject</button></div>';
    } else {
      h += '<p class="ft-th__decided" tabindex="-1" id="' + tid + '-dec' + i + '">' + (st === 'accepted' ? 'Accepted' : 'Rejected') + ' by you' + (e.decided ? ', ' + esc(e.decided) : '') + '.' +
        (st === 'rejected' ? ' The agent can raise it again only if new evidence arrives.' : '') + '</p>';
    }
    if (e.undo) h += '<div class="ft-trail__done ft-th__done" role="status"><span>' + esc(e.undo) + '</span><button type="button" data-th-act="undo" data-th-i="' + i + '">Undo</button></div>';
    return h + '</div>';
  }

  function entryHtml(e, i, tid) {
    if (e.pending) {
      return '<li class="ft-th__entry ft-th__entry--agent is-pending"><span class="ft-th__mark ft-th__mark--agent" aria-hidden="true"></span>' +
        '<div class="ft-th__meta"><span class="ft-th__who">Agent</span></div>' +
        '<p class="ft-th__body"><span class="ft-working"><span class="ft-working-dot" aria-hidden="true"></span>Agent is reading this charge</span></p></li>';
    }
    var who = e.who || 'agent';
    var lead = '';
    if (e.result) lead = '<b class="ft-th__result ft-th__result--' + e.result + '">' + RESULT[e.result] + '.</b> ';
    if (e.answer) lead = '<b class="ft-chip ft-chip--' + e.answer + '">' + ANSWER[e.answer] + '.</b> ';
    var h = '<li class="ft-th__entry ft-th__entry--' + who + (e.kind === 'decision' ? ' is-decision' : '') + '">' +
      '<span class="ft-th__mark ft-th__mark--' + who + '" aria-hidden="true"></span>' +
      '<div class="ft-th__meta"><span class="ft-th__who">' + WHO[who] + '</span>' + (e.date ? '<span class="ft-th__date">' + esc(e.date) + '</span>' : '') + '</div>';
    if (e.text) h += '<p class="ft-th__body">' + lead + esc(e.text) + '</p>';
    if (e.quote) h += '<p class="ft-th__quote">&ldquo;' + esc(e.quote.text) + '&rdquo; <span class="ft-loc">' + esc(e.quote.loc) + '</span></p>';
    if (e.kind === 'suggestion' || e.kind === 'dispute') h += boxHtml(e, i, tid);
    return h + '</li>';
  }

  T.render = function (thread, opts) {
    opts = opts || {};
    var tid = thread.uid || (thread.uid = 'ft-th-' + (++seq));
    var n = thread.entries.filter(function (e) { return !e.pending; }).length;
    var waiting = thread.entries.filter(function (e) { return (e.kind === 'suggestion' || e.kind === 'dispute') && (e.state || 'waiting') === 'waiting'; }).length;
    var h = '<section class="ft-th" aria-labelledby="' + tid + '-h">' +
      '<div class="ft-th__head"><h3 class="ft-th__title" id="' + tid + '-h">' + esc(opts.heading || 'Thread') + '</h3>' +
      '<span class="ft-th__count">' + n + ' ' + (n === 1 ? 'entry' : 'entries') + (waiting ? ' <span class="ft-sep">&middot;</span> <b class="ft-th__waiting">' + waiting + ' waiting for you</b>' : '') + '</span></div>' +
      '<ol class="ft-th__list" aria-label="' + esc((opts.heading || 'Thread') + (thread.about ? ', ' + thread.about : '')) + '">' +
      thread.entries.map(function (e, i) { return entryHtml(e, i, tid); }).join('') + '</ol>';
    if (opts.ask !== false) {
      var busy = thread.entries.some(function (e) { return e.pending; });
      h += '<form class="ft-th__ask" data-th-ask novalidate><label class="ft-th__asklabel" for="' + tid + '-q">Ask the agent about ' + esc(thread.about || 'this charge') + '</label>' +
        '<div class="ft-th__askrow"><textarea class="ft-textarea ft-th__q" id="' + tid + '-q" name="q" rows="1" aria-describedby="' + tid + '-qn"' + (busy ? ' disabled' : '') + ' placeholder="' + esc(opts.placeholder || 'For example: what would close this?') + '">' + esc(thread.draft || '') + '</textarea>' +
        '<button type="submit" class="ft-btn ft-btn--sm"' + (busy ? ' disabled' : '') + '>Ask</button></div>' +
        '<p class="ft-th__note" id="' + tid + '-qn">It answers about ' + esc(thread.about || 'this charge') + ' only. If it proposes a change, the change comes back here as a suggestion for you to accept.</p></form>';
    }
    h += '<div class="ft-sr-only" role="status" aria-live="polite" id="' + tid + '-live">' + esc(thread.live || '') + '</div>';
    return h + '</section>';
  };

  T.bind = function (container, thread, opts) {
    opts = opts || {};
    var timers = {};
    function draw(focusSel) {
      var a = document.activeElement, q = container.querySelector('.ft-th__q');
      if (q) thread.draft = q.value;
      container.innerHTML = T.render(thread, opts);
      if (focusSel) { var f = container.querySelector(focusSel); if (f) f.focus(); }
      else if (a && !a.isConnected && container.contains(document.activeElement) === false && a.getAttribute && a.getAttribute('data-th-act')) {
        var h = container.querySelector('.ft-th__title'); if (h) { h.tabIndex = -1; h.focus(); }
      }
    }
    function decide(i, st) {
      var e = thread.entries[i]; e.state = st; e.decided = opts.today || '';
      e.undo = st === 'accepted' ? (e.kind === 'dispute' ? 'Dispute accepted. The check is set aside for this charge, with the agent’s reasoning as your note.' : 'Suggestion accepted. Code rechecks the charge.')
        : 'Rejected. It stays as it was.';
      draw('[data-th-act="undo"][data-th-i="' + i + '"]');
      if (st === 'accepted' && opts.onAccept) opts.onAccept(e); if (st === 'rejected' && opts.onReject) opts.onReject(e);
      clearTimeout(timers[i]);
      timers[i] = setTimeout(function () {
        var had = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-th-i') === String(i);
        e.undo = null; draw(had ? '#' + thread.uid + '-dec' + i : null);
      }, opts.undoMs == null ? 8000 : opts.undoMs);
    }
    container.addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('[data-th-act]') : null; if (!b || !container.contains(b)) return;
      var i = parseInt(b.getAttribute('data-th-i'), 10), act = b.getAttribute('data-th-act');
      if (act === 'accept') decide(i, 'accepted');
      else if (act === 'reject') decide(i, 'rejected');
      else if (act === 'undo') {
        var e = thread.entries[i], was = e.state; clearTimeout(timers[i]);
        e.state = 'waiting'; e.decided = null; e.undo = null;
        draw('[data-th-act="' + (was === 'accepted' ? 'accept' : 'reject') + '"][data-th-i="' + i + '"]');
        if (opts.onUndo) opts.onUndo(e, was);
      }
    });
    container.addEventListener('submit', function (ev) {
      if (!ev.target.hasAttribute || !ev.target.hasAttribute('data-th-ask')) return;
      ev.preventDefault();
      var q = container.querySelector('.ft-th__q'), text = q ? q.value.trim() : '';
      if (!text) { if (q) q.focus(); return; }
      thread.draft = ''; if (q) q.value = '';
      thread.entries.push({ who: 'you', kind: 'comment', date: opts.today || '', text: text });
      thread.entries.push({ pending: true });
      thread.live = 'Question sent. The agent is reading.';
      draw('#' + thread.uid + '-live');
      var h = container.querySelector('.ft-th__title'); if (h) { h.tabIndex = -1; h.focus(); }
      function reply(entry) {
        for (var k = thread.entries.length - 1; k >= 0; k--) if (thread.entries[k].pending) { thread.entries.splice(k, 1); break; }
        entry.who = entry.who || 'agent'; entry.date = entry.date || opts.today || ''; thread.entries.push(entry);
        thread.live = 'The agent answered: ' + (entry.text || '');
        var ae = document.activeElement, mine = !ae || ae === document.body || container.contains(ae);
        draw(mine ? '.ft-th__q' : null);
      }
      if (opts.onAsk) opts.onAsk(text, reply);
      else setTimeout(function () { reply({ kind: 'comment', text: 'Noted. I have nothing on file that answers that yet.' }); }, 1200);
    });
    container.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && ev.target.classList && ev.target.classList.contains('ft-th__q')) {
        ev.preventDefault(); var f = ev.target.form; if (f) { if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true })); }
      }
    });
    draw();
    return { redraw: draw, thread: thread };
  };
})();

/* FundTrail evidence checklist (PR 6, decision 0011): what a charge should have, filled or missing, who added each item,
   and any removal the agent suggests, waiting for the accountant.
   FTChecklist.render(items, opts)          pure: returns HTML
   FTChecklist.summary(items)               {filled, missing, partial, waiting, total}
   FTChecklist.mount(container, items, opts) stateful: Accept, Reject, Undo and Add item, with an inline done line
     opts: {account, total:'$2,300.00', sum:{parts:['$1,800.00','$500.00'], total:'$2,300.00'}, title, onChange(items, action)}
   Item: {need, by:'default'|'code'|'agent'|'you', state:'filled'|'missing'|'partial', filledBy:{name, amount, of, note},
          period, expected, due:'late'|'not-due', rule:{kind:'adds-up'|'rate', math}, removal:{by:'agent', reason, state:'waiting'|'accepted'|'rejected'},
          removed:{by, note}} */
(function () {
  var C = window.FTChecklist = {};
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var BY = { 'default': 'Account default', code: 'Added by code', agent: 'Added by the agent', you: 'Added by you' };
  var STATE = { filled: 'Filled', missing: 'Missing', partial: 'Not complete' };

  C.summary = function (items) {
    var s = { filled: 0, missing: 0, partial: 0, waiting: 0, total: 0 };
    items.forEach(function (it) {
      if (it.removed) return;
      s.total++; s[it.state] = (s[it.state] || 0) + 1;
      if (it.removal && it.removal.state === 'waiting') s.waiting++;
    });
    return s;
  };

  function itemHtml(it, i) {
    var removed = !!it.removed;
    var st = removed ? 'removed' : it.state;
    var stateText = removed ? 'Removed' : (it.state === 'missing' && it.due === 'not-due') ? 'Not due yet' : STATE[it.state];
    var detail = '';
    if (removed) detail = '<span class="ft-cl-detail">' + esc(it.removed.note) + '</span>';
    else if (it.filledBy) {
      detail = '<span class="ft-cl-detail"><span class="ft-cl-file">' + esc(it.filledBy.name) + '</span>' +
        (it.filledBy.amount ? ' <span class="ft-sep">&middot;</span> <span class="ft-amount">' + esc(it.filledBy.amount) + '</span>' + (it.filledBy.of ? ' of <span class="ft-amount">' + esc(it.filledBy.of) + '</span>' : '') : '') +
        (it.filledBy.note ? ' <span class="ft-sep">&middot;</span> ' + esc(it.filledBy.note) : '') + '</span>';
    } else if (it.state === 'missing') {
      detail = '<span class="ft-cl-detail">' + (it.expected ? (it.due === 'not-due' ? 'Expected ' : 'Expected since ') + esc(it.expected) : 'Nothing on file yet') + '</span>';
    } else if (it.note) detail = '<span class="ft-cl-detail">' + esc(it.note) + '</span>';
    var math = it.rule && it.rule.kind === 'rate' && it.rule.math && !removed ? '<span class="ft-cl-math">' + esc(it.rule.math) + ' <span class="ft-cl-checked">checked by code</span></span>' : '';
    var waiting = it.removal && it.removal.state === 'waiting' && !removed;
    var removal = waiting ? '<div class="ft-cl-removal" role="group" aria-label="The agent suggests removing ' + esc(it.need) + '">' +
      '<p class="ft-cl-removal__text"><span class="ft-cl-removal__who">Agent suggests removing this item.</span> ' + esc(it.removal.reason) + '</p>' +
      '<div class="ft-actions"><button type="button" class="ft-btn ft-btn--sm ft-btn--approve" data-cl-act="accept" data-cl-i="' + i + '">Accept</button>' +
      '<button type="button" class="ft-btn ft-btn--sm ft-btn--reject" data-cl-act="reject" data-cl-i="' + i + '">Reject</button></div></div>' : '';
    return '<li class="ft-cl-item is-' + st + (waiting ? ' has-removal' : '') + '" data-cl-i="' + i + '">' +
      '<span class="ft-cl-mark" aria-hidden="true"></span>' +
      '<div class="ft-cl-main"><span class="ft-cl-need">' + esc(it.need) + (it.period ? ' <span class="ft-cl-period">' + esc(it.period) + '</span>' : '') + '</span>' + detail + math + '</div>' +
      '<span class="ft-cl-meta"><span class="ft-cl-state">' + stateText + '</span><span class="ft-cl-by">' + (removed ? '' : BY[it.by]) + '</span></span>' +
      removal + '</li>';
  }

  C.render = function (items, opts) {
    opts = opts || {};
    var s = C.summary(items);
    var head = '<div class="ft-cl-head"><span class="ft-cl-title">' + esc(opts.title || 'Evidence needed') + '</span>' +
      '<span class="ft-cl-count">' + s.filled + ' of ' + s.total + ' filled' + (s.waiting ? ' <span class="ft-sep">&middot;</span> ' + s.waiting + ' waiting for you' : '') + '</span>' +
      (opts.account ? '<span class="ft-cl-account">Ledger account: ' + esc(opts.account) + '</span>' : '') + '</div>';
    var list = '<ul class="ft-cl-list">' + items.map(itemHtml).join('') + '</ul>';
    var sum = opts.sum ? '<p class="ft-cl-sum">' + opts.sum.parts.map(esc).join(' + ') + ' = <span class="ft-amount">' + esc(opts.sum.total) + '</span> <span class="ft-sep">&middot;</span> adds up to the charge <span class="ft-cl-checked">checked by code</span></p>' : '';
    var add = opts.adding ? '<form class="ft-cl-add" data-cl-form="add"><label class="ft-sr-only" for="' + opts.uid + '-add">New item</label>' +
      '<input class="ft-input" id="' + opts.uid + '-add" name="need" placeholder="For example: Signed honorarium letter" autocomplete="off" value="' + esc(opts.draft || '') + '">' +
      '<button class="ft-btn ft-btn--sm" type="submit">Add</button><button class="ft-overrule" type="button" data-cl-act="cancel">Cancel</button></form>'
      : '<button type="button" class="ft-overrule ft-cl-addbtn" data-cl-act="add">Add item</button>';
    var done = opts.done ? '<div class="ft-trail__done ft-cl-done" role="status" tabindex="-1"><span>' + esc(opts.done) + '</span><button type="button" data-cl-act="undo">Undo</button></div>' : '';
    return '<section class="ft-cl" aria-label="' + esc(opts.title || 'Evidence needed') + '">' + head + list + sum + done + '<div class="ft-cl-foot">' + add + '</div></section>';
  };

  var uidN = 0;
  C.mount = function (container, items, opts) {
    opts = opts || {};
    var st = { items: items, done: null, undo: null, adding: false, draft: '' };
    var uid = 'ftcl' + (++uidN);
    function clone(x) { return JSON.parse(JSON.stringify(x)); }
    function draw(focusSel) {
      container.innerHTML = C.render(st.items, { account: opts.account, sum: opts.sum, title: opts.title, done: st.done, adding: st.adding, draft: st.draft, uid: uid });
      var t = focusSel && container.querySelector(focusSel);
      if (t) t.focus();
    }
    function act(text, before, focusSel) { st.undo = before; st.done = text; draw(focusSel || '.ft-cl-done'); if (opts.onChange) opts.onChange(st.items); }
    container.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-cl-act]') : null; if (!b || !container.contains(b)) return;
      var a = b.getAttribute('data-cl-act'), i = parseInt(b.getAttribute('data-cl-i'), 10), before = clone(st.items);
      if (a === 'accept') {
        var it = st.items[i]; it.removal.state = 'accepted'; it.removed = { by: 'you', note: 'Removed by you, accepting the agent’s suggestion: ' + it.removal.reason };
        act('Removed “' + it.need + '”. Code rechecks the charge without it.', before);
      } else if (a === 'reject') {
        var r = st.items[i]; r.removal.state = 'rejected';
        act('Kept “' + r.need + '”. The agent can’t suggest this again unless new evidence arrives.', before);
      } else if (a === 'undo') {
        var back = st.undo; st.items = back; st.undo = null; st.done = null; draw('[data-cl-act="accept"], [data-cl-act="add"]');
        if (opts.onChange) opts.onChange(st.items);
      } else if (a === 'add') { st.adding = true; st.draft = ''; draw('#' + uid + '-add'); }
      else if (a === 'cancel') { st.adding = false; draw('[data-cl-act="add"]'); }
    });
    container.addEventListener('input', function (e) { if (e.target.name === 'need' && container.contains(e.target)) st.draft = e.target.value; });
    container.addEventListener('submit', function (e) {
      if (!container.contains(e.target)) return; e.preventDefault();
      var v = st.draft.trim(); if (!v) { var inp = container.querySelector('#' + uid + '-add'); if (inp) inp.focus(); return; }
      var before = clone(st.items); st.items.push({ need: v, by: 'you', state: 'missing', expected: opts.today || null });
      st.adding = false; st.draft = '';
      act('Added “' + v + '”. It takes effect right away.', before);
    });
    draw();
    return { state: st, draw: draw };
  };
})();

/* FundTrail problem list: records with problems of their own, the row actions (Snooze, Accept with a note),
   the two dialogs, and the standing notes list. Follows PR 6 (decision 0010), not merged yet.

   FTProblems.recordRowHtml(rec, opts)   a record row that sits in the same .ft-ledger list as charge rows
     rec: { id, kind: 'term'|'unlinked'|'overlinked'|'disagree'|'duplicate'|'flag', title, why, listed (date text),
            by: 'code'|'agent', amount? (text), actions? (array of act ids; default per kind), selected? }
   FTProblems.rowActionsHtml(id, acts)   the quiet row actions for a charge row: put it inside .ft-row__desc
     acts default ['snooze', 'accept']; other ids: 'confirm-dup', 'not-dup', 'open'
   FTProblems.bind(container, handlers)  delegated clicks on [data-pb-act]: handlers[act](id, button); stops the row's own click
   FTProblems.acceptDialog(opts, onDone) opts: { target: {id, title, problem, account?, vendor?, amount?, kind: 'charge'|'record'},
                                                 opener, alsoCovers? (number of other charges a standing note would cover today) }
                                          onDone({ note, standing }) ; returns nothing. Esc, Cancel and the scrim close it.
   FTProblems.snoozeDialog(opts, onDone) opts: { target, opener, today: 'YYYY-MM-DD', windowOpens: 'YYYY-MM-DD' }
                                          onDone({ until: 'YYYY-MM-DD', untilText, reason })
   FTProblems.acceptDialogHtml / snoozeDialogHtml(opts)   the same markup, for static cards
   FTProblems.doneText(kind, target, result)   the sentence for the inline done line (ft-trail__done) after an action
   FTProblems.stateTagHtml(state)        { state: 'snoozed'|'accepted'|'standing', until? } for a charge that left the list
   FTProblems.standingNotesHtml(notes, opts)  notes: [{ id, note, by, date, problem, account, vendor, covers: [{id, name, amount}] }]
   FTProblems.fmtDate('YYYY-MM-DD') -> 'Apr 30, 2026' */
(function () {
  var P = window.FTProblems = window.FTProblems || {};
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function parse(iso) { var p = String(iso).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(d) { function z(n) { return (n < 10 ? '0' : '') + n; } return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
  P.fmtDate = function (s) { var d = parse(s); return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); };

  /* What each kind of record is called, and what you can do about it on the row */
  var KINDS = {
    term: { tag: 'Term to confirm', acts: ['open', 'snooze'] },
    unlinked: { tag: 'Bill not charged', acts: ['snooze', 'accept'] },
    overlinked: { tag: 'Bill over-linked', acts: ['open', 'snooze'] },
    disagree: { tag: 'Terms disagree', acts: ['open', 'snooze'] },
    duplicate: { tag: 'Duplicate file', acts: ['confirm-dup', 'not-dup'] },
    flag: { tag: 'Agent flag', acts: ['snooze', 'accept'] }
  };
  var ACT_LABEL = { snooze: 'Snooze', accept: 'Accept with a note', open: 'Review', 'confirm-dup': 'Confirm duplicate', 'not-dup': 'Not a duplicate' };
  P.KINDS = KINDS;

  P.rowActionsHtml = function (id, acts, name) {
    acts = acts || ['snooze', 'accept'];
    return '<span class="ft-pb-actions" role="group" aria-label="Actions for ' + esc(name || id) + '">' + acts.map(function (a) {
      return '<button type="button" class="ft-pb-act" data-pb-act="' + a + '" data-pb-id="' + esc(id) + '">' + ACT_LABEL[a] + '</button>';
    }).join('') + '</span>';
  };

  P.recordRowHtml = function (rec, opts) {
    opts = opts || {};
    var k = KINDS[rec.kind] || KINDS.flag;
    var by = rec.by === 'agent' ? 'Flagged by the agent' : 'Raised by code';
    return '<div class="ft-row ft-pb-row ft-pb-row--' + rec.kind + (rec.selected ? ' is-selected' : '') + '" role="row" tabindex="0" data-id="' + esc(rec.id) + '" data-row="record">' +
      '<span class="ft-row__date">' + esc(rec.listed) + '<span class="ft-id ft-pb-rec">Record</span></span>' +
      '<span class="ft-row__desc"><span class="ft-row__name">' + esc(rec.title) + '</span>' +
        '<span class="ft-row__reason">' + esc(rec.why) + ' <span class="ft-pb-by">' + by + '.</span></span>' +
        (opts.actions === false ? '' : P.rowActionsHtml(rec.id, rec.actions || k.acts, rec.title)) + '</span>' +
      '<span class="ft-row__amount ft-amount">' + esc(rec.amount || '') + '</span>' +
      '<span class="ft-row__bucket"><span class="ft-pb-kind">' + k.tag + '</span></span></div>';
  };

  P.bind = function (container, handlers) {
    container.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-pb-act]') : null;
      if (!b || !container.contains(b)) return;
      /* stopImmediatePropagation: a row-select listener on the same list would redraw it and drop the button the dialog returns focus to */
      e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault();
      var f = handlers && handlers[b.getAttribute('data-pb-act')];
      if (f) f(b.getAttribute('data-pb-id'), b);
    });
    container.addEventListener('keydown', function (e) {
      if (e.target.closest && e.target.closest('[data-pb-act]') && (e.key === 'Enter' || e.key === ' ')) e.stopPropagation();
    });
  };

  P.stateTagHtml = function (s) {
    var t = s.state === 'snoozed' ? 'Snoozed until ' + P.fmtDate(s.until) : s.state === 'standing' ? 'Accepted under the accountant’s note' : 'Accepted with your note';
    return '<span class="ft-pb-state ft-pb-state--' + s.state + '">' + esc(t) + '</span>';
  };

  P.doneText = function (kind, target, r) {
    var who = target.id && target.kind !== 'record' ? target.id : target.title;
    if (kind === 'snooze') return who + ' snoozed until ' + r.untilText + '. It comes back then if it isn’t fixed.';
    if (r.standing) return who + ' accepted with a standing note. It also covers every charge with the same problem, account and vendor.';
    return who + ' accepted with your note. It leaves the problem list, and comes back if the facts change.';
  };

  /* ---------- the dialogs ---------- */
  var seq = 0;
  function summary(t) {
    return '<div class="ft-pb-target"><span class="ft-pb-target__name">' + (t.kind === 'record' ? '' : '<span class="ft-id">' + esc(t.id) + '</span> ') + esc(t.title) +
      (t.amount ? ' <span class="ft-sep">&middot;</span> <span class="ft-amount">' + esc(t.amount) + '</span>' : '') + '</span>' +
      '<span class="ft-pb-target__problem">' + esc(t.problem) + '</span></div>';
  }
  P.acceptDialogHtml = function (o, id) {
    id = id || 'ft-pb-' + (++seq);
    var t = o.target, charge = t.kind !== 'record', canStand = charge && !!t.vendor;
    var stand = '';
    if (charge) {
      stand = '<div class="ft-pb-standing' + (canStand ? '' : ' is-off') + '">' +
        '<label class="ft-pb-check"><input type="checkbox" name="standing"' + (canStand ? '' : ' disabled') + (o.standing && canStand ? ' checked' : '') + ' aria-describedby="' + id + '-st"> Make it a standing note</label>' +
        '<p id="' + id + '-st">' + (canStand
          ? 'It also covers every charge on this grant, past and future, with this same problem, ledger account and vendor. Every other check still runs.'
          : 'This charge has no vendor, so the note can only cover this charge.') + '</p>' +
        (canStand ? '<dl class="ft-pb-covers"><dt>Problem</dt><dd>' + esc(t.problemShort || t.problem) + '</dd><dt>Account</dt><dd>' + esc(t.account) + '</dd><dt>Vendor</dt><dd>' + esc(t.vendor) + '</dd>' +
          '<dt>Today</dt><dd>This charge' + (o.alsoCovers ? ' and ' + o.alsoCovers + ' other' + (o.alsoCovers > 1 ? 's' : '') : ' only. Later charges that match are covered as they arrive.') + '</dd></dl>' : '') +
        '</div>';
    }
    return '<form class="ft-dialog-form" novalidate data-pb-form="accept"><div class="ft-dialog-head"><h2 class="ft-dialog-title" id="' + id + '-t">Accept with a note</h2></div>' +
      '<div class="ft-dialog-body"><p id="' + id + '-d" class="ft-pb-lede">It will never fix itself, and you’re fine with it. It leaves the problem list, and comes back if the facts change.</p>' + summary(t) +
      '<div class="ft-field" id="' + id + '-field"><label class="ft-field__label" for="' + id + '-note">Note</label>' +
      '<textarea class="ft-textarea" id="' + id + '-note" name="note" rows="3" aria-required="true" aria-describedby="' + id + '-help" placeholder="For example: moving it off the grant in the adjustment period.">' + esc(o.note || '') + '</textarea>' +
      '<span class="ft-field__hint" id="' + id + '-help">Goes into the evidence report under your name.</span></div>' + stand + '</div>' +
      '<div class="ft-dialog-foot"><button type="button" class="ft-btn" data-pb-dialog="cancel">Cancel</button><button type="submit" class="ft-btn ft-btn--main">Accept with a note</button></div></form>';
  };
  P.snoozeDialogHtml = function (o, id) {
    id = id || 'ft-pb-' + (++seq);
    var t = o.target, today = o.today || iso(new Date()), win = o.windowOpens;
    var min = iso(new Date(parse(today).getTime() + 86400000));
    var def = o.until || iso(new Date(parse(today).getTime() + 14 * 86400000));
    if (win && def > win) def = win;
    return '<form class="ft-dialog-form" novalidate data-pb-form="snooze"><div class="ft-dialog-head"><h2 class="ft-dialog-title" id="' + id + '-t">Snooze until a date</h2></div>' +
      '<div class="ft-dialog-body"><p id="' + id + '-d" class="ft-pb-lede">You expect it to fix itself. It comes back on that date if it isn’t fixed, or sooner if a new problem shows up.</p>' + summary(t) +
      '<div class="ft-pb-grid"><div class="ft-field" id="' + id + '-dfield"><label class="ft-field__label" for="' + id + '-date">Bring it back on</label>' +
      '<input class="ft-input" type="date" id="' + id + '-date" name="until" value="' + def + '" min="' + min + '"' + (win ? ' max="' + win + '"' : '') + ' aria-describedby="' + id + '-dhelp">' +
      '<span class="ft-field__hint" id="' + id + '-dhelp">' + (win ? 'Every snooze ends ' + P.fmtDate(win) + ', when the 90-day closeout window opens.' : 'Every snooze ends when the 90-day closeout window opens.') + '</span></div>' +
      '<div class="ft-field" id="' + id + '-rfield"><label class="ft-field__label" for="' + id + '-reason">Why</label>' +
      '<input class="ft-input" id="' + id + '-reason" name="reason" autocomplete="off" aria-required="true" aria-describedby="' + id + '-rhelp" placeholder="For example: refund coming, check Mar 1" value="' + esc(o.reason || '') + '">' +
      '<span class="ft-field__hint" id="' + id + '-rhelp">Shows on the charge while it’s snoozed.</span></div></div></div>' +
      '<div class="ft-dialog-foot"><button type="button" class="ft-btn" data-pb-dialog="cancel">Cancel</button><button type="submit" class="ft-btn ft-btn--main">Snooze</button></div></form>';
  };

  var cur = null;
  function close(returnFocus) {
    if (!cur) return;
    var c = cur; cur = null;
    c.dlg.parentNode.removeChild(c.dlg); c.scrim.parentNode.removeChild(c.scrim);
    var app = document.querySelector('.ft-app');
    if (app && !(window.FTViewer && window.FTViewer.isOpen && window.FTViewer.isOpen())) app.removeAttribute('inert');
    if (returnFocus && c.opener && c.opener.isConnected) c.opener.focus();
  }
  P.close = function () { close(true); };
  function setError(dlg, fieldId, helpId, msg, hint) {
    var f = dlg.querySelector('#' + fieldId), h = dlg.querySelector('#' + helpId), inp = f && f.querySelector('input, textarea');
    if (!f) return;
    f.classList.toggle('is-invalid', !!msg);
    if (msg) { inp.setAttribute('aria-invalid', 'true'); h.className = 'ft-field__error'; h.textContent = msg; }
    else { inp.removeAttribute('aria-invalid'); h.className = 'ft-field__hint'; h.textContent = hint; }
  }
  function open(kind, o, onDone) {
    close(false);
    var id = 'ft-pb-' + (++seq);
    var scrim = document.createElement('div'); scrim.className = 'ft-scrim' + (reduce ? '' : ' ft-scrim--in');
    var dlg = document.createElement('section');
    dlg.className = 'ft-dialog ft-pb-dialog' + (reduce ? '' : ' ft-dialog--in');
    dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true');
    dlg.setAttribute('aria-labelledby', id + '-t'); dlg.setAttribute('aria-describedby', id + '-d'); dlg.tabIndex = -1;
    dlg.innerHTML = kind === 'accept' ? P.acceptDialogHtml(o, id) : P.snoozeDialogHtml(o, id);
    var app = document.querySelector('.ft-app'); if (app) app.setAttribute('inert', '');
    document.body.appendChild(scrim); document.body.appendChild(dlg);
    cur = { dlg: dlg, scrim: scrim, opener: o.opener || document.activeElement };
    scrim.addEventListener('click', function () { close(true); });
    dlg.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('[data-pb-dialog="cancel"]') : null; if (b) close(true); });
    dlg.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(true); return; }
      if (e.key !== 'Tab') return;
      var els = Array.prototype.filter.call(dlg.querySelectorAll('button:not([disabled]), input:not([disabled]), textarea'), function (x) { return x.offsetParent !== null; });
      if (!els.length) return;
      var first = els[0], last = els[els.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === dlg)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    var form = dlg.querySelector('form');
    if (kind === 'accept') {
      var note = form.elements.note, noteHint = 'Goes into the evidence report under your name.';
      note.addEventListener('input', function () { if (note.value.trim()) setError(dlg, id + '-field', id + '-help', null, noteHint); });
      form.addEventListener('submit', function (e) {
        e.preventDefault(); e.stopPropagation();
        var v = note.value.replace(/\s+/g, ' ').trim();
        if (!v) { setError(dlg, id + '-field', id + '-help', 'Add a note. It goes into the evidence report.', noteHint); note.focus(); return; }
        var st = form.elements.standing ? form.elements.standing.checked : false;
        close(true); if (onDone) onDone({ note: v, standing: st });
      });
      note.focus();
    } else {
      var d = form.elements.until, r = form.elements.reason, win = o.windowOpens, today = o.today || iso(new Date());
      var dHint = win ? 'Every snooze ends ' + P.fmtDate(win) + ', when the 90-day closeout window opens.' : 'Every snooze ends when the 90-day closeout window opens.';
      var rHint = 'Shows on the charge while it’s snoozed.';
      d.addEventListener('input', function () { setError(dlg, id + '-dfield', id + '-dhelp', null, dHint); });
      r.addEventListener('input', function () { if (r.value.trim()) setError(dlg, id + '-rfield', id + '-rhelp', null, rHint); });
      form.addEventListener('submit', function (e) {
        e.preventDefault(); e.stopPropagation();
        var until = d.value, why = r.value.replace(/\s+/g, ' ').trim(), bad = false;
        if (!until || until <= today) { setError(dlg, id + '-dfield', id + '-dhelp', 'Pick a date after ' + P.fmtDate(today) + '.', dHint); bad = d; }
        else if (win && until > win) { setError(dlg, id + '-dfield', id + '-dhelp', 'Pick a date by ' + P.fmtDate(win) + '. The closeout window ends every snooze.', dHint); bad = d; }
        if (!why) { setError(dlg, id + '-rfield', id + '-rhelp', 'Say why you expect it to fix itself.', rHint); bad = bad || r; }
        if (bad) { bad.focus(); return; }
        close(true); if (onDone) onDone({ until: until, untilText: P.fmtDate(until), reason: why });
      });
      r.focus();
    }
  }
  P.acceptDialog = function (o, onDone) { open('accept', o, onDone); };
  P.snoozeDialog = function (o, onDone) { open('snooze', o, onDone); };
  P.isOpen = function () { return !!cur; };

  /* ---------- standing notes ---------- */
  P.standingNotesHtml = function (notes, opts) {
    opts = opts || {};
    var head = '<div class="ft-pb-notes__head"><h3 class="ft-heading" id="ft-pb-notes-h">Standing notes</h3>' +
      '<span class="ft-caption">Each covers every charge with the same problem, account and vendor. Every other check still runs.</span></div>';
    if (!notes || !notes.length) return '<section class="ft-pb-notes" aria-labelledby="ft-pb-notes-h">' + head +
      '<p class="ft-pb-notes__empty">No standing notes. When you accept a problem with a note, you can make it cover every charge like it.</p></section>';
    return '<section class="ft-pb-notes" aria-labelledby="ft-pb-notes-h">' + head + '<ul class="ft-pb-notes__list">' + notes.map(function (n) {
      return '<li class="ft-pb-note"><div class="ft-pb-note__main"><p class="ft-pb-note__text">“' + esc(n.note) + '”</p>' +
        '<dl class="ft-pb-covers"><dt>Problem</dt><dd>' + esc(n.problem) + '</dd><dt>Account</dt><dd>' + esc(n.account) + '</dd><dt>Vendor</dt><dd>' + esc(n.vendor) + '</dd></dl>' +
        '<span class="ft-caption">Written by ' + esc(n.by) + ', ' + esc(n.date) + '</span></div>' +
        '<div class="ft-pb-note__covers"><span class="ft-pb-note__label">Covers ' + n.covers.length + ' charge' + (n.covers.length === 1 ? '' : 's') + '</span><ul>' +
        n.covers.map(function (c) { return '<li><span class="ft-id">' + esc(c.id) + '</span><span>' + esc(c.name) + '</span><span class="ft-amount">' + esc(c.amount) + '</span></li>'; }).join('') + '</ul>' +
        '<button type="button" class="ft-pb-act ft-pb-act--withdraw" data-pb-act="withdraw" data-pb-id="' + esc(n.id) + '">Withdraw note</button>' +
        '<span class="ft-caption">Withdrawing brings these charges back to the problem list.</span></div></li>';
    }).join('') + '</ul></section>';
  };
})();

</script>

<script>
/* FundTrail viewer frame: builds the sheet, moves between passages, zooms, and handles the keyboard.
   Renderers (FTViewer.text, .email, .pdf, .photo) draw the document; this file draws everything around it.
   FTViewer.mount(container, file, active)  inline, for design system cards
   FTViewer.open(file, active, opener)      over the app, with a scrim; Esc closes and focus returns to the opener
   Checked quotes (decision 0012): a fact with confirmed:false couldn't be placed in its file. The viewer opens its
   page with no guessed highlight and shows the quote beside it, with two ways to settle it: confirm the value, or
   type the right one. Either marks the fact confirmed by the accountant and still unplaced (placed:false). */
(function () {
  var V = window.FTViewer = window.FTViewer || {};
  V.files = V.files || {};
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function where(file, f) { return file.type === 'pdf' || file.type === 'report' ? 'page ' + f.page : file.type === 'photo' ? '' : 'line ' + f.line; }
  /* A fact is unplaced when its quote couldn't be found (unconfirmed), or when the accountant settled it by hand */
  function unplaced(f) { return f.confirmed === false || f.placed === false; }
  /* Draw the document without the active highlight or box, so nothing is guessed */
  function unmark(html) {
    return html.replace(/<mark class="ft-mark-hl is-active"[^>]*>([\s\S]*?)<\/mark>/g, '$1').replace(/<span class="ft-box ft-photo__box"[^>]*><\/span>/g, '')
      .replace(/<div class="ft-photo__tools">[\s\S]*?<\/div>/, '');
  }

  function Viewer(host, file, active, inline) {
    this.host = host; this.file = file; this.inline = inline;
    this.r = V[file.type];
    this.go(active == null ? (file.active || 0) : active, true);
  }
  Viewer.prototype.html = function () {
    var file = this.file, f = file.facts[this.active], r = this.r, n = file.facts.length, i = this.active, z = this.view.zoom;
    var head = '<header class="ft-sheet__head"><div class="ft-sheet__title"><h2 id="ftv-title">' + esc(file.title) + '</h2>' +
      '<span class="ft-sheet__meta"><span class="ft-id">' + esc(file.name) + '</span> <span class="ft-sep">&middot;</span> ' + String(file.meta || '').split(/\s*·\s*/).map(esc).join(' <span class="ft-sep">&middot;</span> ') + '</span></div>' +
      '<div class="ft-sheet__tools"><button type="button" class="ft-btn ft-btn--sm ft-btn--quiet" data-act="download">Download original</button>' +
      (this.inline ? '' : '<span class="ft-vr" aria-hidden="true"></span><button type="button" class="ft-iconbtn ft-iconbtn--close" data-act="close" aria-label="Close viewer"></button>') + '</div></header>';
    var cite;
    if (f.confirmed === false) cite = '<b>' + esc(f.label) + '</b><span class="ft-vu-flag">Unconfirmed</span><span>' + (file.type === 'photo' ? 'The second look didn’t read the same value' : 'Couldn’t place this quote in the file') + '</span>';
    else if (f.placed === false) cite = '<b>' + esc(f.label) + '</b><span>Confirmed by you <span class="ft-sep">&middot;</span> not placed in the file</span>';
    else cite = r.cite ? r.cite(file, f) : file.type === 'photo'
      ? '<b>' + esc(f.label) + '</b><span>Box checked by a second look</span>'
      : '<b>' + esc(f.label) + '</b><span>Exact passage <span class="ft-sep">&middot;</span> ' + where(file, f) + '</span>';
    var zoom = '';
    if (r.zooms) {
      var lo = z <= r.zooms[0] + 1e-6, hi = z >= r.zooms[r.zooms.length - 1] - 1e-6;
      zoom = '<span class="ft-zoom" role="group" aria-label="Zoom"><button type="button" class="ft-iconbtn ft-iconbtn--minus" data-act="zoomout" aria-label="Zoom out"' + (lo ? ' aria-disabled="true"' : '') + '></button>' +
        '<span class="ft-zoom__level" aria-live="polite">' + Math.round(z * 100) + '%</span><button type="button" class="ft-iconbtn ft-iconbtn--plus" data-act="zoomin" aria-label="Zoom in"' + (hi ? ' aria-disabled="true"' : '') + '></button></span><span class="ft-vr" aria-hidden="true"></span>';
    }

      else { x0 = PAD; x1 = ln.right ? pw - PAD : PAD + tw; }

        top: y, bottom: y + lh, base: y + Math.round(size * 1.15), x0: x0, x1: x1 });

    var x0 = Math.min.apply(null, ls.map(function (l) { return l.x0; })) - 7, x1 = Math.max.apply(null, ls.map(function (l) { return l.x1; })) + 7;
    var y0 = Math.min.apply(null, ls.map(function (l) { return l.top; })) - 4, y1 = Math.max.apply(null, ls.map(function (l) { return l.bottom; })) + 3;

    var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });

    for (x = w; x > 0; x -= t) s += ' L' + r1(Math.max(0, x - t / 2)) + ' ' + h + ' L' + r1(Math.max(0, x - t)) + ' ' + (h - d);

  var D = {"total": 51, "charged": "$96,412.18", "counts": {"complete": 48, "conflict": 1, "human": 2, "missing": 0}, "budget": {"Materials and Supplies": {"budget": 4000000, "charged": 3056500, "n": 20}, "Other Direct Costs": {"budget": 6000000, "charged": 5349333, "n": 20}, "Participant Support Costs": {"budget": 2000000, "charged": 1235385, "n": 11}}, "note": {"note": "Example Cloud Storage bills the card on file each year and sends no invoice. The card statement in the department files is the record.", "problem": "No bill on file", "account": "Other Direct Costs", "vendor": "Example Cloud Storage", "why": "L-0366, L-0556 and L-0670 have the same account and vendor, but each has an invoice on file, so none has this problem. A future charge that does is covered."}};
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  }

  /* ---------- the terms ---------- */
  var END_OLD = { k: 'end-old', group: 'Dates', kind: 'Period of performance', value: 'Feb 1, 2023 to Jan 31, 2026',
    file: 'F1', label: 'End date', text: 'February 1, 2023 through January 31, 2026', loc: 'award_letter.txt, line 15' };
  var END_NEW = { k: 'end-new', group: 'Dates', kind: 'Period of performance', value: 'Feb 1, 2023 to Jan 31, 2027',
    file: 'F2', label: 'New end date', text: 'changed from January 31, 2026 to January 31, 2027', loc: 'extension_notice.txt, line 8' };
  var LINES = ['Materials and Supplies', 'Other Direct Costs', 'Participant Support Costs'];
  var BUDGET_TEXT = { 'Materials and Supplies': 'Materials and Supplies: $40,000', 'Other Direct Costs': 'Other Direct Costs: $60,000', 'Participant Support Costs': 'Participant Support Costs: $20,000' };
  var FIXED = LINES.map(function (l, i) {
    var b = D.budget[l];
    return { k: 'line-' + i, group: 'Budget lines', kind: 'Budget line', value: l + ', ' + money(b.budget), line: l, file: 'F1', label: l, text: BUDGET_TEXT[l], loc: 'award_letter.txt, line 17' };
  }).concat([
    { k: 'pi', group: 'People and roles', kind: 'Person', value: 'Dr. Robin Example, principal investigator', email: 'robin.example@university.example',
      file: 'F1', label: 'Principal investigator', text: 'Dr. Robin Example, robin.example@university.example', loc: 'award_letter.txt, line 9' },
    { k: 'po', group: 'People and roles', kind: 'Person', value: 'Dr. Jesse Sample, program officer', email: 'jesse.sample@funder.example',
      file: 'F1', label: 'Program officer', text: 'Dr. Jesse Sample, jesse.sample@funder.example', loc: 'award_letter.txt, line 11' },
    { k: 'go', group: 'People and roles', kind: 'Person', value: 'Casey Placeholder, grants officer', email: 'casey.placeholder@funder.example',
      file: 'F1', label: 'Grants officer', text: 'Casey Placeholder, casey.placeholder@funder.example', loc: 'award_letter.txt, line 13' },
    { k: 'rule', group: 'Approval rules', kind: 'Approval rule', value: 'Participant support money used for other costs needs the program officer’s written approval, through Research.gov',
      file: 'F1', label: 'Approval rule', text: 'without prior written approval from the Program Officer, requested through Research.gov', loc: 'award_letter.txt, line 19' }
  ]);
  var GROUPS = ['Dates', 'Budget lines', 'People and roles', 'Approval rules', 'Other terms'];

  /* ---------- state ---------- */
  function initial() { return { at: 'apr12', ext: 'confirmed', notes: false, sel: 'end-new', done: null }; }
  var state = initial(), undoState = null, doneTimer = null, toastTimer = null;
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function today() { return state.at === 'apr10' ? 'Apr 10, 2026' : 'Apr 12, 2026'; }
  function counts() {
    var c = { complete: D.counts.complete - 2, conflict: 1, human: 2, missing: 0 }; /* 46 others are always complete; L-0981 conflict; L-1010 and L-1019 need a human */
    if (state.ext === 'confirmed') c.complete++; else c.conflict++;            /* L-1002 */
    if (state.at === 'apr12') c.complete++; else c.missing++;                  /* L-1015, its receipt photo arrives Apr 12 */
    return c;
  }
  /* PR 6: Missing evidence goes on the problem list 60 days past the posting date, or 90 days before the end date in force,
     whichever comes first. L-1015 posted Jan 16, 2026, so it is listed from Mar 17, 2026 whatever the end date.
     A term waiting for confirmation is a record on the problem list too. */
  function endInForce() { return state.ext === 'confirmed' ? '2027-01-31' : '2026-01-31'; }
  function nowISO() { return state.at === 'apr10' ? '2026-04-10' : '2026-04-12'; }
  function missingListed() {
    var now = new Date(nowISO() + 'T12:00:00'), end = new Date(endInForce() + 'T12:00:00'), sixty = new Date('2026-03-17T12:00:00');
    return now >= sixty || (end - now) / 864e5 <= 90;
  }
  function termRecords() { return state.ext === 'waiting' ? 1 : 0; }
  function problemCount() { var c = counts(); return c.conflict + c.human + (missingListed() ? c.missing : 0) + termRecords(); }
  function waitingCount() { return state.ext === 'waiting' ? 1 : 0; }
  function inForce() { return [state.ext === 'confirmed' ? END_NEW : END_OLD].concat(FIXED); }
  function term(k) { var all = [END_OLD, END_NEW].concat(FIXED); for (var i = 0; i < all.length; i++) if (all[i].k === k) return all[i]; return null; }

  /* ---------- chrome ---------- */
  function renderChrome() {
    var c = counts(), total = D.total, done = c.complete;
    $('gt-caption').innerHTML = '<span class="ft-id">SYN-2300117</span> <span class="ft-sep">&middot;</span> National Science Foundation (NSF) <span class="ft-sep">&middot;</span> <span class="ft-amount">$120,000.00</span> awarded <span class="ft-sep">&middot;</span> <span class="ft-amount">' + D.charged + '</span> charged';
    $('gt-ready').innerHTML = '<div class="ft-ready__head"><span class="ft-ready__num">' + done + '</span><span class="ft-ready__of">of ' + total + ' charges ready for closeout</span></div>' +
      '<div class="ft-ready__bar" aria-hidden="true">' + (c.conflict ? '<span class="is-conflict" style="flex:' + c.conflict + '"></span>' : '') + (c.human ? '<span class="is-human" style="flex:' + c.human + '"></span>' : '') +
      (c.missing ? '<span class="is-missing" style="flex:' + c.missing + '"></span>' : '') + '<span class="is-complete" style="flex:' + done + '"></span></div>';
    $('gt-side-problems').textContent = problemCount();
    var w = waitingCount(); $('gt-side-terms').hidden = !w; $('gt-side-terms').textContent = w + ' waiting';
    $('gt-clock').textContent = today();
    var nx = $('gt-next');
    if (state.at === 'apr10') { nx.disabled = false; nx.textContent = 'Next: receipt photo, Apr 12'; } else { nx.disabled = true; nx.textContent = 'Nothing else scheduled'; }
  }

  /* ---------- the list ---------- */
  function row(t, opts) {
    opts = opts || {};
    var cls = 'ft-term' + (state.sel === t.k ? ' is-selected' : '') + (opts.replaced ? ' is-replaced' : '') + (opts.waiting ? ' is-check' : '');
    var note = opts.note ? '<span class="ft-gt-meta">' + opts.note + '</span>' : '';
    var acts = opts.acts || (opts.when ? '<span class="ft-gt-when">' + opts.when + '</span>' : '');
    return '<li class="' + cls + '" data-k="' + t.k + '"><span class="ft-term__kind">' + esc(t.kind) + '</span>' +
      '<div class="ft-term__main"><button type="button" class="ft-gt-pick" data-pick="' + t.k + '" aria-pressed="' + (state.sel === t.k) + '">' + esc(t.value) + '</button>' + note +
      quote(t.file, t.label, t.text, t.loc) + (opts.below || '') + '</div><div class="ft-term__actions">' + acts + '</div></li>';
  }
  function budgetNote(t) {
    var b = D.budget[t.line];
    return 'Charged ' + money(b.charged) + ' of ' + money(b.budget) + ' <span class="ft-sep">&middot;</span> ' + money(b.budget - b.charged) + ' left';
  }
  function doneLine() {
    if (!state.done) return '';
    return '<div class="ft-trail__done" role="status" tabindex="-1" id="gt-done"><span>' + state.done + '</span><button type="button" data-act="undo">Undo</button></div>';
  }
  function renderList() {
    var h = '';
    /* Waiting for you */
    var w = waitingCount();
    h += '<section class="ft-gt-sec" aria-labelledby="gt-h-wait"><div class="ft-gt-sec__head"><h2 id="gt-h-wait">Waiting for you</h2><span>' + (w ? w + ' to decide' : '') + '</span></div>' + doneLine();
    if (state.ext === 'waiting') {
      var acts = '<div class="ft-gt-acts"><div class="ft-actions"><button type="button" class="ft-btn ft-btn--approve ft-btn--main" data-act="confirm">Confirm grant extension</button><button type="button" class="ft-btn ft-btn--reject" data-act="reject">Reject amendment</button></div>' +
        '<p class="ft-trail__scope">Updates the grant end date to Jan 31, 2027 and rechecks its charges. 1 charge would become ready.</p></div>';
      h += '<ul class="ft-terms" aria-label="Terms waiting for you">' + row(END_NEW, { waiting: true, note: 'Amendment 01, read by the agent from Google Drive, Apr 10, 2026. Also on the problem list.', below: acts, acts: '<span class="ft-state ft-state--waiting">Waiting for you</span>' }) + '</ul>';
    }
    if (!w && !state.done) h += '<p class="ft-gt-empty">Nothing waiting. New terms from an award letter or amendment show up here and on the problem list. The agent’s suggestions wait in each charge’s thread.</p>';
    else if (!w) h += '<p class="ft-gt-empty">Nothing else waiting.</p>';
    h += '</section>';
    /* In force */
    var terms = inForce();
    h += '<section class="ft-gt-sec" aria-labelledby="gt-h-force"><div class="ft-gt-sec__head"><h2 id="gt-h-force">In force</h2><span>The terms code checks charges against</span></div>';
    GROUPS.forEach(function (g) {
      var ts = terms.filter(function (t) { return t.group === g; });
      h += '<div class="ft-gt-group">' + g + '</div>';
      if (!ts.length) { h += '<p class="ft-gt-empty">None in the award letter or its amendment.</p>'; return; }
      h += '<ul class="ft-terms" aria-label="' + g + '">' + ts.map(function (t) {
        var note = t.line ? budgetNote(t) : t.k === 'end-new' ? 'From amendment 01, confirmed Apr 10, 2026' : 'Confirmed Jan 12, 2023';
        return row(t, { note: note });
      }).join('') + '</ul>';
    });
    h += '</section>';
    /* Replaced */
    h += '<section class="ft-gt-sec" aria-labelledby="gt-h-old"><div class="ft-gt-sec__head"><h2 id="gt-h-old">Replaced or rejected</h2><span>Kept for the record; no check uses them</span></div>';
    var old = '';
    if (state.ext === 'confirmed') old += row(END_OLD, { replaced: true, note: 'Replaced by amendment 01, Apr 10, 2026' });
    if (state.ext === 'rejected') old += row(END_NEW, { replaced: true, note: 'Amendment 01, rejected by you, ' + today() });
    h += old ? '<ul class="ft-terms" aria-label="Replaced or rejected terms">' + old + '</ul>' : '<p class="ft-gt-empty">Nothing replaced yet.</p>';
    h += '</section>';
    h += notesHtml();
    $('gt-list').innerHTML = h;
  }

  /* ---------- standing notes (PR 6): each covers every charge with the same problem, account and vendor ---------- */
  function notesHtml() {
    var h = '<section class="ft-gt-sec" aria-labelledby="gt-h-notes"><div class="ft-gt-sec__head"><h2 id="gt-h-notes">Standing notes</h2><span>Each covers every charge with the same problem, account and vendor</span></div>';
    if (!state.notes || !window.FTProblems) return h + '<p class="ft-gt-empty">No standing notes. When you accept a problem with a standing note, it shows here with the charges it covers.</p></section>';
    var n = D.note, list = window.FTProblems.standingNotesHtml([{ id: 'note-storage', note: n.note, by: 'you', date: 'Apr 12, 2026', problem: n.problem, account: n.account, vendor: n.vendor, covers: [] }]);
    var a = list.indexOf('<ul class="ft-pb-notes__list">'), b = list.lastIndexOf('</section>');
    list = list.slice(a, b);
    /* It covers no charge today: say why, instead of an empty list */
    list = list.replace(/<span class="ft-pb-note__label">Covers 0 charges<\/span><ul><\/ul>/, '<span class="ft-pb-note__label">Covers no charges yet</span><p class="ft-gt-uses" style="margin:0">' + n.why + '</p>')
               .replace('Withdrawing brings these charges back to the problem list.', 'Withdrawing it stops it covering future charges.');
    return h + '<div class="ft-pb-notes">' + list + '</div></section>';
  }

  /* ---------- the selected term ---------- */
  function hist(items) {
    return '<ol class="ft-gt-hist">' + items.map(function (x) { return '<li><time>' + x[0] + '</time><span>' + x[1] + '</span><span class="ft-gt-who">' + x[2] + '</span></li>'; }).join('') + '</ol>';
  }
  function renderDetail() {
    var t = term(state.sel); if (!t) return;
    var replaced = (t.k === 'end-old' && state.ext === 'confirmed') || (t.k === 'end-new' && state.ext === 'rejected');
    var waiting = t.k === 'end-new' && state.ext === 'waiting';
    var stateTxt = waiting ? '<span class="ft-state ft-state--waiting">Waiting for you</span>' : replaced ? '<span class="ft-state ft-state--rejected">' + (t.k === 'end-new' ? 'Rejected' : 'Replaced') + '</span>' : '<span class="ft-state ft-state--confirmed">In force</span>';
    var h = '<div class="ft-panel__section"><span class="ft-gt-detail__kind">' + esc(t.kind) + '</span><h2 class="ft-gt-detail__title">' + esc(t.value) + '</h2><div class="ft-gt-detail__state">' + stateTxt + '</div></div>';
    h += '<div class="ft-panel__section"><span class="ft-gt-label">Source</span>' + quote(t.file, t.label, t.text, t.loc) + '</div>';
    var uses = '';
    if (t.group === 'Dates') {
      if (waiting) uses = 'If you confirm, the end date moves from Jan 31, 2026 to Jan 31, 2027 and code rechecks the grant’s charges against it. <span class="ft-id">L-1002</span>, sequencing done Feb 20, 2026, would become Evidence complete.';
      else if (replaced) uses = t.k === 'end-old' ? 'No check uses it. Code checks dates against amendment 01’s end date, Jan 31, 2027.' : 'No check uses it. The grant still ends Jan 31, 2026.';
      else uses = 'Code checks the date of every charge, ' + D.total + ' in all, against this period.' + (t.k === 'end-old' ? ' <span class="ft-id">L-1002</span>, sequencing done Feb 20, 2026, fails it.' : '');
    } else if (t.line) {
      var b = D.budget[t.line];
      h += '<div class="ft-panel__section"><span class="ft-gt-label">Budget room</span><dl class="ft-gt-room"><div><dt>Budget</dt><dd>' + money(b.budget) + '</dd></div><div><dt>Charged</dt><dd>' + money(b.charged) + '</dd></div><div><dt>Left</dt><dd>' + money(b.budget - b.charged) + '</dd></div></dl>' +
        '<div class="ft-gt-meter" aria-hidden="true"><span style="width:' + (b.charged / b.budget * 100).toFixed(1) + '%"></span></div></div>';
      uses = 'Code checks each charge on this line against the budget room. ' + b.n + ' charges are on it.';
    } else if (t.group === 'People and roles') {
      uses = 'Code matches senders against it: email from <span class="ft-id">' + t.email + '</span> counts as the ' + t.value.split(', ')[1] + '’s.' +
        (t.k === 'pi' ? ' <span class="ft-id">L-1002</span>: the invoice came from this address. <span class="ft-id">L-0981</span>: the approval came from it too, which the approval rule doesn’t accept.' : '') +
        (t.k === 'po' ? ' No approval from this address is on file yet.' : '');
    } else if (t.group === 'Approval rules') {
      uses = 'Applies to the ' + D.budget['Participant Support Costs'].n + ' charges on Participant Support Costs. <span class="ft-id">L-0981</span> fails it: approved by the principal investigator by email, not the program officer through Research.gov.';
    }
    if (uses) h += '<div class="ft-panel__section"><span class="ft-gt-label">What it does</span><p class="ft-gt-uses">' + uses + '</p></div>';
    var hs;
    if (t.k === 'end-new') {
      hs = [['Apr 10, 2026', 'Read from extension_notice.txt, Google Drive', 'Agent']];
      if (state.ext === 'confirmed') hs.push(['Apr 10, 2026', 'Confirmed; replaced the award letter’s end date', 'You']);
      if (state.ext === 'rejected') hs.push([today(), 'Rejected', 'You']);
    } else {
      hs = [['Jan 12, 2023', 'Read from award_letter.txt, uploaded by you', 'Agent'], ['Jan 12, 2023', 'Confirmed with the other award terms', 'You']];
      if (t.k === 'end-old' && state.ext === 'confirmed') hs.push(['Apr 10, 2026', 'Replaced by amendment 01', 'You']);
    }
    h += '<div class="ft-panel__section"><span class="ft-gt-label">History</span>' + hist(hs) + '</div>';
    $('gt-detail').innerHTML = h;
    $('gt-detail').setAttribute('aria-label', t.kind + ': ' + t.value);
  }

  function render(focusSel) {
    renderChrome(); renderList(); renderDetail();
    if (focusSel) { var el = document.querySelector(focusSel); if (el) el.focus(); }
  }

  /* ---------- actions ---------- */
  function finish(text) {
    state.done = text; render('#gt-done');
    clearTimeout(doneTimer);
    doneTimer = setTimeout(function () {
      var had = document.activeElement && document.activeElement.closest && document.activeElement.closest('#gt-done');
      undoState = null; state.done = null; render();
      if (had) { var hh = $('gt-h-wait'); hh.tabIndex = -1; hh.focus(); }
    }, 8000);
  }
  function confirmExt() { undoState = clone(state); state.ext = 'confirmed'; state.sel = 'end-new'; var c = counts(); finish('Extension confirmed. ' + c.complete + ' of ' + D.total + ' charges ready.'); }
  function rejectExt() { undoState = clone(state); state.ext = 'rejected'; state.sel = 'end-new'; finish('Amendment rejected. The grant still ends Jan 31, 2026.'); }
  function withdrawNote() { undoState = clone(state); state.notes = false; finish('Standing note withdrawn. It covered no charges, so nothing comes back to the problem list.'); }
  function undo() {
    if (!undoState) return; clearTimeout(doneTimer); var wasExt = undoState.ext === 'waiting'; state = undoState; undoState = null; state.done = null;
    render(wasExt ? '[data-act="confirm"]' : state.notes ? '[data-pb-act="withdraw"]' : null);
  }
  function toast(text) { $('gt-toast-text').textContent = text; $('gt-toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { $('gt-toast').hidden = true; }, 5000); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button, a, li.ft-term') : null; if (!t) return;
    if (window.FTViewer && window.FTViewer.isOpen && window.FTViewer.isOpen() && t.closest('.ft-sheet')) return;
    if (t.tagName === 'A') {
      e.preventDefault();
      var fid = t.getAttribute('data-file');
      if (fid && window.FTViewer && window.FTViewer.files[fid]) window.FTViewer.open(window.FTViewer.files[fid], parseInt(t.getAttribute('data-fact'), 10), t);
      return;
    }
    if (t.tagName === 'LI') { var k0 = t.getAttribute('data-k'); if (k0 && k0 !== state.sel) { state.sel = k0; render('[data-pick="' + k0 + '"]'); } return; }
    if (t.getAttribute('data-pb-act') === 'withdraw') { withdrawNote(); return; }
    var act = t.getAttribute('data-act'), pick = t.getAttribute('data-pick');
    if (pick) { state.sel = pick; render('[data-pick="' + pick + '"]'); return; }
    if (act === 'confirm') confirmExt();
    else if (act === 'reject') rejectExt();
    else if (act === 'undo') undo();
    else if (t.id === 'gt-next' && state.at === 'apr10') { state.at = 'apr12'; render(); toast('Receipt photo linked to L-1015. Field boat rental is now Evidence complete.'); }
  });

  /* Arrow keys, Home and End move through the visible term rows and select, like the Charges and Evidence lists.
     Only when focus is on a term row, so the workspace menus keep their own arrow keys. */
  document.addEventListener('keydown', function (e) {
    var t = e.target; if (!t || !t.classList || !t.classList.contains('ft-gt-pick')) return;
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'Home' && e.key !== 'End') return;
    var rows = Array.prototype.filter.call(document.querySelectorAll('button.ft-gt-pick'), function (b) { return b.offsetParent !== null; });
    var i = rows.indexOf(t); if (i < 0 || !rows.length) return;
    var j = e.key === 'Home' ? 0 : e.key === 'End' ? rows.length - 1 : i + (e.key === 'ArrowDown' ? 1 : -1);
    e.preventDefault();
    if (j < 0 || j >= rows.length || j === i) return;
    var k = rows[j].getAttribute('data-pick'); state.sel = k; render('[data-pick="' + k + '"]');
  });

  var root = document.documentElement, themes = document.querySelectorAll('[data-set-theme]');
  function markTheme() { var th = root.getAttribute('data-theme') || 'light'; themes.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-set-theme') === th)); }); }
  themes.forEach(function (b) { b.addEventListener('click', function () { root.setAttribute('data-theme', b.getAttribute('data-set-theme')); markTheme(); }); });

  /* ---------- a hash can jump to a state, for screenshots: #at=apr10, #state=notes, #sel=line-0, #t=dark ---------- */
  var h = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) h[p[0]] = decodeURIComponent(p[1] || ''); });
  if (h.t) root.setAttribute('data-theme', h.t);
  markTheme();
  if (h.at === 'apr10') { state.at = 'apr10'; state.ext = 'waiting'; state.sel = 'end-new'; }
  if (h.state === 'notes') { state.notes = true; }
  if (h.sel && term(h.sel)) state.sel = h.sel;
  render();
})();
</script>

<script>
/* FundTrail workspace and account menus, with the New workspace and Reset dialogs.
   Drop into any page that has the app shell: FTWorkspaceMenu.attach(options).
   It turns the sidebar's .ft-workspace block and its Account button into menu buttons.
   options: workspaces [{id, name, note, demo}], current (id), user {name, email},
            onNavigate(kind, value): kind is 'workspace' (value: id), 'new' (value: name), 'reset' (value: id) or 'signout'.
            Return false from onNavigate to skip the default (the default only updates the workspace button's label).
   Also: FTWorkspaceMenu.open('workspace' | 'account'), .dialog('new' | 'reset'), .close(). Plain ES5, no dependencies. */
(function () {
  var M = window.FTWorkspaceMenu = window.FTWorkspaceMenu || {};
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var opts = null, wsBtn = null, acBtn = null, menu = null, menuKind = null, dlg = null, scrim = null, seq = 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function current() { for (var i = 0; i < opts.workspaces.length; i++) if (opts.workspaces[i].id === opts.current) return opts.workspaces[i]; return opts.workspaces[0]; }

    menu.id = 'ft-menu-' + kind; menu.setAttribute('role', 'menu');

    } else if (kind === 'new' || kind === 'reset') { close(false); dialog(kind); }
    else if (kind === 'signout') { close(true); nav('signout'); }
  }

  /* ---------- dialogs ---------- */
  function dialogHtml(kind, id) {
    if (kind === 'reset') {
      return '<div class="ft-dialog-head"><h2 class="ft-dialog-title" id="' + id + '-t">Reset the demo workspace?</h2></div>' +
        '<div class="ft-dialog-body" id="' + id + '-d"><p>It goes back to how it started. This can’t be undone.</p>' +
        '<ul class="ft-dialog-list"><li>Your answers, confirmations, splits and sign-offs are removed.</li><li>Files you uploaded or forwarded to its grants are removed.</li>' +
        '<li>The clock goes back to where the demo starts.</li><li>Your other workspaces don’t change.</li></ul></div>' +
        '<div class="ft-dialog-foot"><button type="button" class="ft-btn" data-ft-dialog="cancel">Cancel</button><button type="button" class="ft-btn ft-btn--reject" data-ft-dialog="reset">Reset workspace</button></div>';
    }
    return '<form class="ft-dialog-form" novalidate><div class="ft-dialog-head"><h2 class="ft-dialog-title" id="' + id + '-t">New workspace</h2></div>' +
      '<div class="ft-dialog-body"><p id="' + id + '-d">A workspace holds its own grants, ledgers and evidence. Only you can see it.</p>' +
      '<div class="ft-field" id="' + id + '-field"><label class="ft-field__label" for="' + id + '-name">Name</label>' +
      '<input class="ft-input" id="' + id + '-name" name="name" autocomplete="off" placeholder="For example: Biology department" aria-describedby="' + id + '-help">' +
      '<span class="ft-field__hint" id="' + id + '-help">Add grants to it after you create it.</span></div></div>' +
      '<div class="ft-dialog-foot"><button type="button" class="ft-btn" data-ft-dialog="cancel">Cancel</button><button type="submit" class="ft-btn ft-btn--main" data-ft-dialog="create">Create workspace</button></div></form>';
  }
  function dialog(kind) {
    closeDialog(false); close(false);
    var id = 'ft-dialog-' + (++seq);
    scrim = document.createElement('div'); scrim.className = 'ft-scrim' + (reduce ? '' : ' ft-scrim--in');
    dlg = document.createElement('section');
    dlg.className = 'ft-dialog' + (reduce ? '' : ' ft-dialog--in');
    dlg.setAttribute('role', kind === 'reset' ? 'alertdialog' : 'dialog'); dlg.setAttribute('aria-modal', 'true');
    dlg.setAttribute('aria-labelledby', id + '-t'); dlg.setAttribute('aria-describedby', id + '-d'); dlg.tabIndex = -1;
    dlg.setAttribute('data-ft-kind', kind);

      current: 'demo',

<!-- @layout-scripts -->
<script>
/* The standard layout without a thread dock, for pages whose items have no review thread (Evidence, Grant terms).
   The grant header stays put; under it the list and the selected item fill the rest of the screen and scroll on
   their own, with the same proportions and the same quiet transition as the grant page and Charges (chat-c.js).
   Below 1024px wide the page falls back to one normal scroll. */
(function () {
  var css = '' +
    '.ft-app { min-height: 0 !important; height: 100vh; }' +
    '.ft-sidebar { position: sticky !important; top: 0; height: 100vh !important; overflow-y: auto; }' +
    '.ft-main { height: 100vh; min-height: 0; overflow: hidden; }' +
    '.ft-content { flex: 1; min-height: 0; overflow: hidden; }' +
    '.ft-content > .ft-split { flex: 1; min-height: 0; align-items: stretch; }' +
    '.ft-content > .ft-split > * { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }' +
    '.ft-content > .ft-split > .demo-col { padding-bottom: var(--space-4); }' +
    '.ft-ev-scroll { max-height: none !important; overflow: visible !important; }' +
    '.ft-toast { left: calc(var(--sidebar-width) + 24px) !important; transform: none !important; }' +
    '@media (prefers-reduced-motion: no-preference) { .ft-ss-in { animation: ft-ss-in 160ms ease both; } }' +
    '@keyframes ft-ss-in { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }' +
    '@media (max-width: 1023px) { .ft-app, .ft-main, .ft-content { height: auto; overflow: visible; } .ft-content > .ft-split > * { overflow: visible; } .ft-ev-scroll { max-height: max(360px, calc(100vh - 330px)) !important; overflow-y: auto !important; } }';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  /* The selected item's panel: when a different item opens, it starts at its top and slides in quietly;
     a redraw of the same item (Confirm, Undo, an inline form) keeps its scroll position. */
  var PANELS = ['ev-detail', 'gt-detail'];
  function key(p) { var t = p.querySelector('h2, .ft-charge-title, .ft-gt-detail__title'); return t ? t.textContent : ''; }
  function watch(p) {
    var last = key(p), pos = 0;
    p.addEventListener('scroll', function () { pos = p.scrollTop; }, { passive: true });
    new MutationObserver(function () {
      var k = key(p);
      if (k === last) { if (p.scrollTop !== pos) p.scrollTop = pos; return; }
      last = k; p.scrollTop = 0; pos = 0;
      p.classList.remove('ft-ss-in'); void p.offsetWidth; p.classList.add('ft-ss-in');
    }).observe(p, { childList: true });
  }

  /* Keep the selected row in view inside its own scrolling column when the keyboard moves the selection */
  document.addEventListener('keydown', function (e) {
    if (['ArrowDown', 'ArrowUp', 'Home', 'End'].indexOf(e.key) < 0) return;
    setTimeout(function () { var r = document.activeElement; if (r && r.closest && r.closest('.ft-split') && r.scrollIntoView) r.scrollIntoView({ block: 'nearest' }); }, 0);
  });

  function start() { PANELS.forEach(function (id) { var p = document.getElementById(id); if (p) watch(p); }); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
<!-- /layout-scripts -->
