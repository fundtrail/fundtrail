<!-- @dsCard group="Status" height=176 subtitle="Four buckets, heaviest first" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BucketBadge preview</title></head>
<body>
<div class="ft-stage">
  <div class="ft-stage-row">
    <span class="ft-badge ft-badge--conflict">Possible conflict</span>
    <span class="ft-badge ft-badge--human">Needs a human</span>
    <span class="ft-badge ft-badge--missing">Missing evidence</span>
    <span class="ft-badge ft-badge--complete">Evidence complete</span>
  </div>
  <div class="ft-stage-row">
    <span class="ft-status"><span class="ft-badge ft-badge--complete">Evidence complete</span><span class="ft-tag ft-tag--rechecking">Rechecking</span></span>
    <span class="ft-status"><span class="ft-badge ft-badge--conflict">Possible conflict</span><span class="ft-caption">3 reasons</span></span>
  </div>
  <div class="ft-stage-row" style="padding:var(--space-2) var(--space-2) 0">
    <span class="ft-badge ft-badge--conflict is-stamped">Possible conflict</span>
    <span class="ft-caption">Stamped, beside the charge's name on its details</span>
  </div>
</div>
</body>
</html>
