<!-- @dsCard group="Actions" height=176 subtitle="Outlines; the main action is thicker" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button preview</title></head>
<body>
<div class="ft-stage">
  <div class="ft-stage-row">
    <button class="ft-btn ft-btn--sm ft-btn--approve ft-btn--main">Approve</button>
    <button class="ft-btn ft-btn--sm ft-btn--reject">Reject</button>
  </div>
  <div class="ft-stage-row">
    <button class="ft-btn ft-btn--main">Sign off</button>
    <button class="ft-btn">Open in viewer</button>
    <button class="ft-btn ft-btn--quiet">Show all reasons</button>
    <button class="ft-btn" disabled>Export report</button>
  </div>
  <div class="ft-stage-row">
    <button class="ft-btn ft-btn--sm ft-btn--approve ft-btn--main">Confirm</button>
    <button class="ft-btn ft-btn--sm ft-btn--reject">Reject</button>
    <span class="ft-caption">Confirm on a grant term uses the Approve style.</span>
  </div>
</div>
</body>
</html>
